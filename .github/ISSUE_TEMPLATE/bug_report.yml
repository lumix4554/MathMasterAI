name: Bug report
description: Report a reproducible problem in MathMaster AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include bot tokens, API keys, personal data, database files, or private logs."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the bot...\n2. Choose...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, installed optional dependencies"
  - type: textarea
    id: logs
    attributes:
      label: Sanitised error output
      description: Remove all credentials and personal information before posting.
